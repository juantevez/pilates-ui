server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;   # el encabezado Server no muestra la versión de nginx

    # CSP y demás encabezados de seguridad. Lo genera docker/40-write-config.sh al arrancar
    # (connect-src depende de API_URL). nginx no hereda add_header en una location que
    # define los suyos, así que cada location con add_header lo vuelve a incluir.
    include /etc/nginx/security-headers.inc;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # config.js se genera al arrancar: nunca cachearlo.
    location = /config.js {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:css|js)$ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Las fuentes casi nunca cambian.
    location /fonts/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (router del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
